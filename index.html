
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">MY PRODUCTIVITY SPACE</p>
      <h1>My To-Do List</h1>
      <p class="subtitle">Small steps, big progress.</p>
    </header>

    <form id="task-form" class="task-form">
      <label for="task-input">Add a new task</label>
      <div class="input-row">
        <input
          type="text"
          id="task-input"
          placeholder="What needs to be done?"
          maxlength="150"
          required
        >
        <button type="submit" class="add-btn">Add Task</button>
      </div>
    </form>

    <section class="task-section">
      <div class="task-heading">
        <h2>Your Tasks</h2>
        <span id="task-count">0 tasks</span>
      </div>

      <p id="empty-message" class="empty-message">
        No tasks yet. Add your first task above!
      </p>

      <ul id="task-list" aria-label="Your task list"></ul>
    </section>

    <footer>
      <p>Your tasks are saved automatically on this device.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
